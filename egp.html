
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - ไม่พบหน้าที่ค้นหา | CICM e-GP</title>
 
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..900;1,17..18,400..900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
 
<style>
/* ==========================================================
   🎨 PALETTE — แก้สีทั้งหน้าได้จากตรงนี้ที่เดียว
   ========================================================== */
:root {
    --grad-top:    #FF8233;
    --grad-bottom: #FDAC55;
    --accent:      #F16524;
    --menu-top:    #FF6B1A;
    --menu-bottom: #FF9642;
    --on-accent:   #FFFFFF;
}
 
* { margin: 0; padding: 0; box-sizing: border-box; }
 
html { -webkit-text-size-adjust: 100%; }
 
body {
    font-family: "Google Sans", Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    background: var(--grad-top);
}
 
/* ---------- LAYOUT ---------- */
.page {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    background: linear-gradient(to bottom, var(--grad-top) 0%, var(--grad-bottom) 100%);
}
 
/* ---------- BACKGROUND "404" + OVAL ---------- */
.bg-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0.8;
    -webkit-mask-image: linear-gradient(to bottom, black 40%, transparent 95%);
            mask-image: linear-gradient(to bottom, black 40%, transparent 95%);
}
 
.bg-center {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
}
 
#bg404 {
    font-family: Inter, "Google Sans", sans-serif;
    color: #FFFFFF;
    font-weight: 900;
    line-height: 1;
    letter-spacing: -0.05em;
    white-space: nowrap;
    font-size: clamp(200px, 48vw, 800px);
    transform: scale(1.15, 1);
    transform-origin: center;
}
 
#bgOval {
    background: #FFFFFF;
    border-radius: 9999px;
    height: 22vh;
    width: clamp(120px, 20vw, 400px);
    transform: scale(1, 1);
    transform-origin: center;
}
@media (min-width: 640px) { #bgOval { height: 26vh; } }
@media (min-width: 768px) { #bgOval { height: 50vh; } }
 
/* ---------- NAVIGATION ---------- */
.nav {
    position: relative;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px;
    gap: 12px;
}
@media (min-width: 640px) { .nav { padding: 20px 24px; } }
@media (min-width: 768px) { .nav { padding: 20px 48px; } }
 
.logo { display: flex; align-items: center; }
.logo-dots {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 2px;
}
.logo-dots span {
    display: block;
    width: 10px; height: 10px;
    background: #fff;
    border-radius: 9999px;
}
@media (min-width: 640px) { .logo-dots span { width: 12px; height: 12px; } }
.logo-text {
    color: #fff;
    font-weight: 700;
    font-size: 1.125rem;
    margin-left: 8px;
    letter-spacing: -0.01em;
}
@media (min-width: 640px) { .logo-text { font-size: 1.25rem; } }
 
.nav-links { display: none; gap: 4px; }
@media (min-width: 768px) { .nav-links { display: flex; } }
.nav-links a {
    padding: 6px 16px;
    font-size: 0.875rem;
    font-weight: 500;
    border-radius: 9999px;
    background: #fff;
    color: var(--accent);
    text-decoration: none;
    transition: opacity 0.2s ease, color 0.2s ease;
}
.nav-links a:hover { opacity: 0.9; }
 
.menu-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    border: none;
    border-radius: 9999px;
    color: #fff;
    background: var(--accent);
    font-family: inherit;
    cursor: pointer;
    transition: opacity 0.2s ease;
}
@media (min-width: 640px) { .menu-btn { padding: 10px 20px; } }
.menu-btn:hover { opacity: 0.9; }
.menu-btn .label { font-size: 0.875rem; font-weight: 500; display: none; }
@media (min-width: 640px) { .menu-btn .label { display: inline; } }
.icon-16 { width: 16px; height: 16px; }
.icon-20 { width: 20px; height: 20px; }
 
/* ---------- MOBILE MENU OVERLAY ---------- */
.overlay { position: fixed; inset: 0; z-index: 50; visibility: hidden; }
.overlay.open { visibility: visible; }
 
.backdrop {
    position: absolute; inset: 0;
    background: rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    opacity: 0;
    transition: opacity 500ms ease;
}
.overlay.open .backdrop { opacity: 1; }
 
.panel {
    position: absolute;
    top: 0; right: 0;
    height: 100%;
    width: 100%;
    background: linear-gradient(135deg, var(--menu-top) 0%, var(--menu-bottom) 100%);
    transform: translateX(100%);
    transition: transform 500ms cubic-bezier(0.16, 1, 0.3, 1);
    display: flex;
    flex-direction: column;
}
@media (min-width: 640px) { .panel { width: 380px; } }
.overlay.open .panel { transform: translateX(0); }
 
.panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 24px;
}
.close-btn {
    width: 40px; height: 40px;
    display: inline-flex; align-items: center; justify-content: center;
    border: none;
    border-radius: 9999px;
    background: rgba(255, 255, 255, 0.2);
    color: #fff;
    cursor: pointer;
    transition: background 0.2s ease;
}
.close-btn:hover { background: rgba(255, 255, 255, 0.3); }
 
.panel-items {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 8px 24px;
    overflow-y: auto;
}
.panel-items a {
    display: block;
    padding: 16px 24px;
    font-size: 1.125rem;
    font-weight: 600;
    color: #fff;
    text-decoration: none;
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.1);
    opacity: 0;
    transform: translateY(16px);
    transition: opacity 300ms ease, transform 300ms ease, background 300ms ease;
    transition-delay: 0ms;
}
.panel-items a:hover { background: rgba(255, 255, 255, 0.2); }
.overlay.open .panel-items a { opacity: 1; transform: translateY(0); }
 
.panel-cta {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 24px;
    opacity: 0;
    transition: opacity 300ms ease;
    transition-delay: 0ms;
}
.overlay.open .panel-cta { opacity: 1; transition-delay: 450ms; }
.panel-cta a {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 16px 0;
    border-radius: 9999px;
    background: #fff;
    color: var(--accent);
    font-weight: 600;
    font-size: 1rem;
    text-decoration: none;
    transition: transform 0.2s ease;
}
.panel-cta a:hover { transform: scale(1.02); }
 
/* ---------- CENTER VISUAL ---------- */
.visual-wrap {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    margin-top: calc(-6vh - 40px);
}
.visual-box {
    width: 120vw; height: 85vh;
    display: flex;
    align-items: center;
    justify-content: center;
}
@media (min-width: 640px) { .visual-box { width: 70vw; height: 70vh; } }
@media (min-width: 768px) { .visual-box { width: 62vw; height: 78vh; } }
 
.visual-box video {
    width: 100%; height: 100%;
    object-fit: contain;
    pointer-events: none;
    mix-blend-mode: darken;
}
.visual-box video[hidden] { display: none; }
 
#fallbackArt {
    width: min(46vh, 78%);
    height: auto;
    animation: floaty 5s ease-in-out infinite;
}
@keyframes floaty {
    0%, 100% { transform: translateY(-8px) rotate(-1.2deg); }
    50%      { transform: translateY(10px) rotate(1.2deg); }
}
@media (prefers-reduced-motion: reduce) {
    #fallbackArt { animation: none; }
}
 
/* ---------- BOTTOM CONTENT ---------- */
.bottom {
    position: relative;
    z-index: 30;
    margin-top: auto;
    padding: 0 16px 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
}
@media (min-width: 640px) { .bottom { padding-bottom: 64px; } }
 
.bottom h1 {
    color: #fff;
    font-size: 1.125rem;
    font-weight: 500;
    margin-bottom: 12px;
    text-wrap: balance;
}
@media (min-width: 640px) { .bottom h1 { font-size: 1.25rem; margin-bottom: 16px; } }
@media (min-width: 768px) { .bottom h1 { font-size: 1.5rem; } }
 
.bottom .sub {
    color: rgba(255, 255, 255, 0.85);
    font-size: 0.875rem;
    margin-bottom: 20px;
    max-width: 34ch;
    text-wrap: balance;
}
 
.cta {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 24px;
    border-radius: 9999px;
    color: #fff;
    background: var(--accent);
    font-weight: 600;
    font-size: 0.875rem;
    text-decoration: none;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}
@media (min-width: 640px) { .cta { padding: 16px 32px; font-size: 1rem; } }
.cta:hover { transform: scale(1.05); box-shadow: 0 10px 24px rgba(0, 0, 0, 0.18); }
 
/* ---------- A11Y ---------- */
a:focus-visible, button:focus-visible {
    outline: 3px solid #fff;
    outline-offset: 3px;
}
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
    }
}
</style>
</head>
 
<body>
<div class="page">
 
    <!-- ===== พื้นหลัง: ตัวเลข 404 ยักษ์ + วงรี ===== -->
    <div class="bg-layer">
        <div class="bg-center"><div id="bg404">404</div></div>
        <div class="bg-center"><div id="bgOval"></div></div>
    </div>
 
    <!-- ===== แถบนำทาง ===== -->
    <nav class="nav">
        <div class="logo">
            <div class="logo-dots"><span></span><span></span><span></span><span></span></div>
            <span class="logo-text">CICM e-GP</span>
        </div>
 
        <div class="nav-links">
            <a href="#">เกี่ยวกับเรา</a>
            <a href="#">ระบบ e-GP</a>
            <a href="#">รายชื่อบุคลากร</a>
            <a href="#">คำถามที่พบบ่อย</a>
            <a href="#">ติดต่อเรา</a>
        </div>
 
        <button class="menu-btn" id="menuBtn" aria-label="เปิดเมนู" aria-expanded="false" aria-controls="menuOverlay">
            <svg class="icon-16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
            <span class="label">เมนู</span>
        </button>
    </nav>
 
    <!-- ===== ภาพกลางหน้า (วิดีโอ + ภาพสำรอง) ===== -->
    <div class="visual-wrap">
        <div class="visual-box">
            <video id="heroVideo" autoplay loop muted playsinline hidden></video>
 
            <svg id="fallbackArt" viewBox="0 0 320 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ภาพประกอบเอกสารที่ค้นหาไม่พบ">
                <ellipse cx="160" cy="286" rx="86" ry="13" fill="#000" opacity="0.10"/>
                <g>
                    <rect x="74" y="46" width="150" height="196" rx="14" fill="#fff"/>
                    <path d="M186 46h10l28 28v10h-38z" fill="#FFD9BC"/>
                    <rect x="98" y="92" width="86" height="10" rx="5" fill="#FFC9A3"/>
                    <rect x="98" y="118" width="102" height="10" rx="5" fill="#FFE0C9"/>
                    <rect x="98" y="144" width="74" height="10" rx="5" fill="#FFE0C9"/>
                    <rect x="98" y="170" width="94" height="10" rx="5" fill="#FFE0C9"/>
                </g>
                <g>
                    <circle cx="196" cy="196" r="52" fill="#fff" opacity="0.28"/>
                    <circle cx="196" cy="196" r="52" stroke="#F16524" stroke-width="12" fill="none"/>
                    <rect x="228" y="228" width="66" height="20" rx="10" transform="rotate(45 228 228)" fill="#F16524"/>
                    <path d="M180 182l32 28M212 182l-32 28" stroke="#F16524" stroke-width="11" stroke-linecap="round"/>
                </g>
            </svg>
        </div>
    </div>
 
    <!-- ===== เนื้อหาด้านล่าง ===== -->
    <div class="bottom">
        <h1>ขออภัย ไม่พบหน้าที่คุณกำลังค้นหา</h1>
        <p class="sub">หน้านี้อาจถูกย้าย เปลี่ยนชื่อ หรือลบไปแล้ว ลองกลับไปเริ่มที่หน้าหลัก</p>
        <a class="cta" href="/">
            <svg class="icon-16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
            กลับหน้าหลัก
        </a>
    </div>
</div>
 
<!-- ===== เมนู Overlay ===== -->
<div class="overlay" id="menuOverlay" role="dialog" aria-modal="true" aria-label="เมนูหลัก">
    <div class="backdrop" id="backdrop"></div>
    <div class="panel">
        <div class="panel-head">
            <div class="logo">
                <div class="logo-dots"><span></span><span></span><span></span><span></span></div>
                <span class="logo-text">CICM e-GP</span>
            </div>
            <button class="close-btn" id="closeBtn" aria-label="ปิดเมนู">
                <svg class="icon-20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            </button>
        </div>
 
        <div class="panel-items" id="panelItems">
            <a href="#">เกี่ยวกับเรา</a>
            <a href="#">ระบบ e-GP</a>
            <a href="#">รายชื่อบุคลากร</a>
            <a href="#">คำถามที่พบบ่อย</a>
            <a href="#">ติดต่อเรา</a>
        </div>
 
        <div class="panel-cta">
            <a href="/">
                <svg class="icon-20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
                กลับหน้าหลัก
            </a>
        </div>
    </div>
</div>
 
<script>
// ==========================================================
// 🎬 วิดีโอกลางหน้า — เปลี่ยน URL ได้ที่บรรทัดนี้
//    ถ้าเว้นว่าง หรือโหลดไม่สำเร็จ จะใช้ภาพ SVG สำรองแทนอัตโนมัติ
// ==========================================================
const VIDEO_SRC = "";
 
(function initVideo() {
    const video = document.getElementById("heroVideo");
    const art = document.getElementById("fallbackArt");
    if (!VIDEO_SRC) return;
 
    video.addEventListener("loadeddata", () => {
        video.hidden = false;
        art.style.display = "none";
    });
    video.addEventListener("error", () => {
        video.hidden = true;
        art.style.display = "";
    });
    video.src = VIDEO_SRC;
})();
 
// ==========================================================
// 📐 ปรับสเกลแนวตั้งของตัวเลข 404 และวงรี ตามความสูงจอ
// ==========================================================
const el404 = document.getElementById("bg404");
const elOval = document.getElementById("bgOval");
 
function applyScale() {
    const h = el404.offsetHeight;
    if (!h) return;
    const scaleY = window.innerHeight / h;
    el404.style.transform = `scale(1.15, ${scaleY * 1.4})`;
 
    // ตัวเลข 404 ถูกยืดสูง = 1.4 เท่าของความสูงจอเสมอ ช่องว่างกลางเลข 0
    // จึงสูงราว 0.84 เท่าของจอ — วงรีต้องสูงกว่านั้นเล็กน้อยเพื่อกลบให้สนิท
    elOval.style.height = (window.innerHeight * 0.92) + "px";
    elOval.style.transform = "scale(1, 1)";
}
 
window.addEventListener("resize", applyScale);
window.addEventListener("orientationchange", applyScale);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(applyScale);
applyScale();
 
// ==========================================================
// 🍔 เมนู Overlay
// ==========================================================
const overlay = document.getElementById("menuOverlay");
const menuBtn = document.getElementById("menuBtn");
const closeBtn = document.getElementById("closeBtn");
const backdrop = document.getElementById("backdrop");
const items = Array.from(document.querySelectorAll("#panelItems a"));
 
function setMenu(open) {
    overlay.classList.toggle("open", open);
    menuBtn.setAttribute("aria-expanded", String(open));
    document.body.style.overflow = open ? "hidden" : "";
    items.forEach((item, i) => {
        item.style.transitionDelay = open ? `${150 + i * 60}ms` : "0ms";
    });
    if (open) closeBtn.focus();
    else menuBtn.focus();
}
 
menuBtn.addEventListener("click", () => setMenu(true));
closeBtn.addEventListener("click", () => setMenu(false));
backdrop.addEventListener("click", () => setMenu(false));
document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && overlay.classList.contains("open")) setMenu(false);
});
</script>
</body>
</html>
