<head>
<meta charset="UTF-8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">

<style>
/* 🎨 1. Dynamic Font Sizing & Base */
html {
    font-size: 16px;
}
@media (max-width: 768px) {
    html { font-size: 14px; }
}

body {
    font-family: "Google Sans", -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-optical-sizing: auto;
    font-variation-settings: "GRAD" 0;
    margin: 0;
    padding: 40px 20px;
    min-height: 100vh;
    background: linear-gradient(-45deg, #f0f2f5, #e0e5ec, #f5f7fa);
    background-size: 400% 400%;
    animation: gradientBG 15s ease infinite;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    color: #1c1c1e;
}

@keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* 🧊 2. Glassmorphism Container */
.container {
    width: 100%;
    max-width: 95%;
    font-size: clamp(0.875rem, 2vw, 1rem);
    background: rgba(255, 255, 255, 0.8);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.3);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    border-radius: 28px;
    padding: 40px;
    position: relative;
}

/* ⚡ Quick Actions */
.quick-actions {
    display: flex;
    gap: 10px;
    margin-bottom: 30px;
    flex-wrap: wrap;
}
.quick-actions button {
    background: rgba(255, 255, 255, 0.5);
    color: #1c1c1e;
    border: 1px solid rgba(0,0,0,0.1);
    padding: 8px 16px;
    font-size: 0.85rem;
    border-radius: 20px;
    transition: all 0.2s ease;
}
.quick-actions button span { font-weight: bold; color: #86868b; }
.quick-actions button:hover { background: rgba(0, 0, 0, 0.05); color: #1c1c1e; box-shadow: none; transform: translateY(-2px); }

/* 📝 3. Typography & Sections */
h2 {
    font-size: 1.4rem;
    font-weight: 600;
    margin-top: 0;
    margin-bottom: 24px;
}

hr {
    border: none;
    height: 1px;
    background: rgba(0,0,0,0.1);
    margin: 40px 0;
}

.section {
    scroll-margin-top: 20px;
    transition: opacity 0.3s ease;
    border-radius: 16px;
    padding: 10px;
}

/* 🎛️ 4. Form Elements (Textareas & Inputs) */
.form-group {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
    align-items: flex-start;
}

textarea, input[type="text"] {
    width: 100%;
    border: 1px solid rgba(0, 0, 0, 0.1);
    border-radius: 10px;
    padding: 12px;
    font-family: inherit;
    font-size: 1rem;
    transition: all 0.2s ease;
    background: rgba(255, 255, 255, 0.9);
    color: inherit;
    resize: vertical;
    
    box-sizing: border-box;
}

textarea:focus, input[type="text"]:focus {
    outline: none;
    border-color: #007AFF;
    box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.2);
    background: #fff;
}

.small-area { height: 60px; }
.large-area { height: 380px; white-space: pre-wrap; }
.signature-area { height: 200px; white-space: pre-wrap; }

/* 🖱️ 5. Buttons & Micro-interactions */
button {
    background: rgba(0, 122, 255, 0.9);
    border: none;
    border-radius: 10px;
    color: white;
    font-weight: 500;
    padding: 12px 24px;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s ease;
    backdrop-filter: blur(5px);
    white-space: nowrap;
}

button:hover {
    background: rgba(0, 122, 255, 1);
    transform: scale(1.02);
    box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
}

button:active {
    transform: scale(0.98);
}

/* Radio Buttons */
label { display: inline-flex; align-items: center; cursor: pointer; font-weight: 500; }
input[type="radio"] {
    appearance: none;
    background: rgba(255,255,255,0.8);
    margin: 0 10px 0 0;
    width: 22px; height: 22px;
    border: 2px solid rgba(0,0,0,0.2);
    border-radius: 50%;
    display: grid;
    place-content: center;
    transition: all 0.2s ease;
}
input[type="radio"]::before {
    content: ""; width: 12px; height: 12px;
    border-radius: 50%; transform: scale(0);
    transition: 0.2s transform cubic-bezier(0.2, 0.8, 0.2, 1);
    box-shadow: inset 1em 1em #007AFF;
}
input[type="radio"]:checked { border-color: #007AFF; }
input[type="radio"]:checked::before { transform: scale(1); }

/* 📋 6. Table Styles (Apple Style) */
.table-wrapper {
    max-height: 400px;
    overflow-y: auto;
    border-radius: 12px;
    border: 1px solid rgba(0, 0, 0, 0.1);
    background: rgba(255, 255, 255, 0.6);
    box-shadow: inset 0 2px 10px rgba(0,0,0,0.02);
    
}

.table-wrapper::-webkit-scrollbar { width: 8px; }
.table-wrapper::-webkit-scrollbar-track { background: transparent; }
.table-wrapper::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 10px; }

table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.9rem;
    text-align: left;
}
th, td {
    padding: 12px 16px;
    border-bottom: 1px solid rgba(0,0,0,0.05);
}
th {
    position: sticky;
    top: 0;
    background: rgba(245, 245, 247, 0.95);
    backdrop-filter: blur(10px);
    font-weight: 600;
    color: #86868b;
    z-index: 10;
}
tr { transition: background 0.2s ease; }
tr:hover { background: rgba(0, 122, 255, 0.05); }

.mini-btn {
    padding: 6px 12px;
    font-size: 0.8rem;
    border-radius: 14px;
    background: rgba(0, 122, 255, 0.1);
    color: #007AFF;
    font-weight: 600;
}
.mini-btn:hover { background: rgba(0, 122, 255, 0.2); transform: none; box-shadow: none; }

/* ----------------------------------- */
/* 📱 Layout แบบ 5 คอลัมน์ (1 Row, 5 Columns) */
/* ----------------------------------- */
.copy-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr); /* แบ่งเป็น 5 คอลัมน์เท่าๆ กัน */
    gap: 15px; /* ระยะห่างระหว่างกล่อง */
}

.copy-item {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.copy-item textarea {
    height: 80px; /* ปรับความสูงให้พอดีกับข้อความที่มี 2 บรรทัด */
    font-size: 0.9rem; /* ปรับตัวอักษรให้เล็กลงนิดนึงจะได้ไม่ล้นจอ */
}

.copy-item button {
    width: 100%;
    padding: 10px;
    font-size: 0.9rem;
}

/* ถ้าหน้าจอเล็ก (มือถือ/แท็บเล็ต) ให้กลับมาเรียงแนวตั้ง */
@media (max-width: 768px) {
    .copy-grid {
        grid-template-columns: 1fr;
    }
}

/* 🌙 7. Dark Mode Support */
@media (prefers-color-scheme: dark) {
    body { background: #000; color: #fff; }
    .container { background: rgba(28, 28, 30, 0.8); color: #fff; border-color: rgba(255,255,255,0.1); }
    textarea, input[type="text"] { background: rgba(44, 44, 46, 0.8); color: #fff; border-color: rgba(255, 255, 255, 0.1); }
    textarea:focus, input[type="text"]:focus { background: #1c1c1e; border-color: #0A84FF; box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.3); }
    button { background: #0A84FF; }
    button:hover { background: #3095ff; box-shadow: 0 4px 12px rgba(10, 132, 255, 0.4); }
    .quick-actions button { background: rgba(255,255,255,0.1); color: #fff; border-color: rgba(255,255,255,0.1); }
    .quick-actions button:hover { background: rgba(255,255,255,0.15); color: #fff; }
    hr { background: rgba(255,255,255,0.1); }
    input[type="radio"] { background: rgba(44, 44, 46, 0.8); border-color: rgba(255,255,255,0.3); }
    #livePreview > div { background: #1c1c1e !important; border: 1px solid rgba(255,255,255,0.1); }
    
    /* Table Dark Mode */
    .table-wrapper { background: rgba(28, 28, 30, 0.6); border-color: rgba(255,255,255,0.1); }
    th { background: rgba(44, 44, 46, 0.95); color: #a1a1a6; }
    th, td { border-bottom-color: rgba(255,255,255,0.05); }
    tr:hover { background: rgba(10, 132, 255, 0.1); }
    .mini-btn { background: rgba(10, 132, 255, 0.2); color: #4facff; }
    .mini-btn:hover { background: rgba(10, 132, 255, 0.3); }
}

/* Toast Animation */
@keyframes slideIn {
    from { transform: translateX(100%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
}
</style>
</head>

        <div class="copy-item">
            <textarea id="text11">Sub ReplaceAmountAndUpdateFields()
    Dim oldAmount As String
    Dim newAmount As String
    
    ' 1. Input dialog for old and new amounts
    oldAmount = InputBox("Enter the OLD amount to replace:", "Old Amount")
    If oldAmount = "" Then Exit Sub
    
    newAmount = InputBox("Enter the NEW amount:", "New Amount")
    If newAmount = "" Then Exit Sub
    
    ' Turn off screen updating to prevent flickering and speed up execution
    Application.ScreenUpdating = False
    
    ' 2. Turn on Field Codes (Equivalent to 1st Alt + F9)
    ActiveWindow.View.ShowFieldCodes = True
    
    ' 3. Find and Replace text in all story ranges (including textboxes, headers/footers)
    Dim rng As Range
    For Each rng In ActiveDocument.StoryRanges
        With rng.Find
            .Text = oldAmount
            .Replacement.Text = newAmount
            .Forward = True
            .Wrap = wdFindContinue
            .Format = False
            .MatchCase = False
            .MatchWholeWord = False
            .Execute Replace:=wdReplaceAll
        End With
    Next rng
    
    ' 4. Update all fields (Equivalent to Ctrl + A then F9)
    ActiveDocument.Fields.Update
    
    ' 5. Turn off Field Codes (Equivalent to 2nd Alt + F9)
    ActiveWindow.View.ShowFieldCodes = False
    
    ' Turn screen updating back on
    Application.ScreenUpdating = True
    
    ' Success Message
    MsgBox "Amount replaced from " & oldAmount & " to " & newAmount & " and fields updated successfully!", vbInformation, "Done"
End Sub</textarea>

function loadStaffTable() {
    const tbody = document.getElementById("staffTableBody");
    const rows = rawStaffData.trim().split('\n');
    let html = "";

    rows.forEach(row => {
        const cols = row.split('\t');
        if(cols.length >= 6) {
            const prefix = cols[1] ? cols[1].trim() : "";
            const academic = cols[2] ? cols[2].trim() : "";
            const rank = cols[3] ? cols[3].trim() : "";
            const fullName = cols[4] ? cols[4].trim() : "";
            
            // ----------------------------------------------------
            // 📝 จัดการข้อความสำหรับคัดลอก (Copy Text)
            // ----------------------------------------------------
            let textToCopy = "";
            
            if (academic || rank) {
                // เงื่อนไขใหม่: ถ้ามีตำแหน่งวิชาการหรือยศ -> ไม่ต้องเอาคำนำหน้า
                // ผลลัพธ์: ศาสตราจารย์ ดร. เกศรา ณ บางช้าง
                textToCopy = [academic, rank, fullName].filter(Boolean).join(" ");
            } else {
                // ถ้าไม่มีตำแหน่งวิชาการหรือยศ -> เอาคำนำหน้าติดกับชื่อ
                // ผลลัพธ์: นางสาวสุดารักษ์ สิริอังควรา
                textToCopy = prefix + fullName;
            }

            // ----------------------------------------------------
            // 📊 จัดการข้อความสำหรับแสดงในตาราง (Display Text)
            // ----------------------------------------------------
            const displayTitle = [academic, rank].filter(Boolean).join(" ");

            html += `<tr>
                <td>${cols[0]}</td>
                <td>${prefix}</td>
                <td>${displayTitle}</td>
                <td style="font-weight: 500;">${fullName}</td>
                <td style="color: #555;">${cols[5]}</td>
                <td><button class="mini-btn" onclick="copyCustomText('${textToCopy}')">Copy ชื่อ</button></td>
            </tr>`;
        }
    });
    tbody.innerHTML = html;
}

// โหลดตารางตอนเปิดเว็บ
window.onload = loadStaffTable;

// ฟังก์ชันค้นหาในตาราง (Search Filter)
function filterTable() {
    let input = document.getElementById("searchInput");
    let filter = input.value.toUpperCase();
    let table = document.getElementById("staffTable");
    let tr = table.getElementsByTagName("tr");

    for (let i = 1; i < tr.length; i++) {
        let tdElements = tr[i].getElementsByTagName("td");
        let match = false;
        // ค้นหาทุกๆ คอลัมน์
        for(let j=0; j<5; j++) {
            if (tdElements[j]) {
                let txtValue = tdElements[j].textContent || tdElements[j].innerText;
                if (txtValue.toUpperCase().indexOf(filter) > -1) {
                    match = true;
                    break;
                }
            }
        }
        tr[i].style.display = match ? "" : "none";
    }
}

// ฟังก์ชันแสดง Toast แจ้งเตือน
function showToast(message) {
    const oldToast = document.getElementById('apple-toast');
    if (oldToast) oldToast.remove();

    const toast = document.createElement('div');
    toast.id = 'apple-toast';
    toast.textContent = message;
    toast.style.cssText = `
        position: fixed; top: 30px; right: 30px;
        background: #28CD41; color: white;
        padding: 12px 24px; border-radius: 30px;
        font-size: 15px; font-family: inherit; font-weight: 500;
        box-shadow: 0 4px 15px rgba(40, 205, 65, 0.4);
        animation: slideIn 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        z-index: 1000;
    `;
    
    document.body.appendChild(toast);
    setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(-10px)';
        toast.style.transition = 'all 0.3s ease';
        setTimeout(() => toast.remove(), 300);
    }, 2000);
}

// Copy จาก Input/Textarea
function copyWithAnimation(id) {
    const el = document.getElementById(id);
    if (!el.value) return; 
    
    el.select();
    document.execCommand('copy');
    
    el.style.backgroundColor = 'rgba(0, 122, 255, 0.1)';
    setTimeout(() => el.style.backgroundColor = '', 300);

    showToast('✓ คัดลอกแล้ว');
}

// Copy ข้อความที่กำหนดเอง (เช่น รายชื่อในตาราง)
function copyCustomText(text) {
    const tempInput = document.createElement("textarea");
    tempInput.value = text;
    document.body.appendChild(tempInput);
    tempInput.select();
    document.execCommand("copy");
    document.body.removeChild(tempInput);
    
    showToast(`✓ คัดลอก "${text}" แล้ว`);
}

// Keyboard Shortcuts
document.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'c') {
        const activeEl = document.activeElement;
        if (activeEl && activeEl.tagName === 'TEXTAREA') {
            copyWithAnimation(activeEl.id);
        }
    }
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
        if (document.activeElement.id === 'amountInput') {
            generateText();
        }
    }
});

function toThaiNumber(num){
    return num.replace(/\d/g, d => "๐๑๒๓๔๕๖๗๘๙"[d]);
}

function numberToThaiText(number){
    const txtNumArr = ["ศูนย์","หนึ่ง","สอง","สาม","สี่","ห้า","หก","เจ็ด","แปด","เก้า"];
    const txtDigitArr = ["","สิบ","ร้อย","พัน","หมื่น","แสน","ล้าน"];

    number = parseFloat(number).toFixed(2);
    let [integer, decimal] = number.split(".");
    let bahtText = "";
    let len = integer.length;

    for(let i=0;i<len;i++){
        let n = parseInt(integer.charAt(i));
        if(n!=0){
            if(i==(len-1) && n==1 && len>1) bahtText+="เอ็ด";
            else if(i==(len-2) && n==2) bahtText+="ยี่";
            else if(i==(len-2) && n==1) bahtText+="";
            else bahtText+=txtNumArr[n];
            bahtText+=txtDigitArr[len-i-1];
        }
    }
    bahtText+="บาท";

    if(decimal=="00"){
        bahtText+="ถ้วน";
    }else{
        if(decimal.charAt(0)!="0"){
            if(decimal.charAt(0)=="2") bahtText+="ยี่";
            else if(decimal.charAt(0)!="1") bahtText+=txtNumArr[decimal.charAt(0)];
            bahtText+="สิบ";
        }
        if(decimal.charAt(1)!="0"){
            if(decimal.charAt(1)=="1" && decimal.charAt(0)!="0") bahtText+="เอ็ด";
            else bahtText+=txtNumArr[decimal.charAt(1)];
        }
        bahtText+="สตางค์";
    }
    return bahtText;
}
